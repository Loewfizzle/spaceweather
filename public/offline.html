<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyGlow — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #060d1a;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #0d1425;
      border: 1px solid #1e2937;
      border-radius: 1rem;
      padding: 2rem 2rem 1.75rem;
      max-width: 22rem;
      width: 100%;
    }
    .icon {
      font-size: 2.25rem;
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.125rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      line-height: 1.6;
      color: #64748b;
      margin-bottom: 1.5rem;
    }
    button {
      background: transparent;
      border: 1px solid #1e2937;
      border-radius: 0.5rem;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.875rem;
      padding: 0.5rem 1.25rem;
      transition: border-color 0.15s, color 0.15s;
    }
    button:hover { border-color: #334155; color: #e2e8f0; }
    .brand {
      font-size: 0.75rem;
      color: #334155;
      margin-top: 1.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✦</div>
    <h1>You&rsquo;re offline</h1>
    <p>SkyGlow needs a connection to fetch live solar wind and aurora data. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
    <div class="brand">SkyGlow</div>
  </div>
</body>
</html>
